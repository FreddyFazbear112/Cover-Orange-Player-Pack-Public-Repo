<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Orange Player Pack</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000; 
        }
        /* Forces the Ruffle player object to scale correctly on the webpage */
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            // Replaces body contents with the direct Ruffle window object
            document.body.appendChild(player);

            // Configures advanced emulation settings to resolve the asset freeze
            player.config = {
                autoplay: "on",
                unmuteOverlay: "hidden",
                letterbox: "on"
            };

            player.load("CoverOrangeLP_v13k.swf"); 
        });
    </script>

</body>
</html>
