<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Orange: Players Pack</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0c10; }
        #flash-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="flash-container"></div>

    <!-- Inject the modern browser emulator -->
    <script src="https://unpkg.com"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            player.load({
                // Linked to your specific file name
                url: "CoverOrangeLP_v13k.swf", 
                allowScriptAccess: true
            });
        });
    </script>

</body>
</html>
