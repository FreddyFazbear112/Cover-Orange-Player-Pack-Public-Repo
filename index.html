<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Orange Player Pack</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000; 
        }
        #flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
            max-width: 800px;
            max-height: 600px;
        }
    </style>
</head>
<body>

    <div id="flash-container"></div>

    <script>
        // Directly inject Ruffle configurations into the browser runtime
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowScriptAccess: true,
            autoplay: "on",
            unmuteOverlay: "hidden",
            letterbox: "on",
            openUrlMode: "confirm",
            upgradeToHttps: true
        };

        // Dynamically append the polyfill directly to force GitHub's cache bypass
        const script = document.createElement("script");
        script.src = "https://unpkg.com/";
        script.crossOrigin = "anonymous";
        script.onload = () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            // Appends a cache-busting timestamp identifier to the target URL
            const cacheBuster = "?t=" + new Date().getTime();
            player.load("CoverOrangeLP_v13k.swf" + cacheBuster).catch((err) => {
                console.error("Ruffle core initialization error: ", err);
            });
        };
        document.head.appendChild(script);
    </script>

</body>
</html>
