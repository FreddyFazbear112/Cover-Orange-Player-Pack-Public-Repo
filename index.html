<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Orange Player Pack</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #flash-container { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="flash-container"></div>

    <!-- Load Ruffle Engine -->
    <script src="https://unpkg.com"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": true,
            "letterbox": "on",
            "polyfills": ["static-content", "plugin-detect", "dynamic-content"]
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            // CORRECT FILENAME WITH STRICT CASE-SENSITIVITY
            player.load("./CoverOrangeLP_v13k.swf"); 
        });
    </script>

</body>
</html>
