<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Orange Player Pack</title>
    <style>
        /* This makes the game fit perfectly on your screen with a clean black background */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000000; 
        }
        #flash-container { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
    </style>
    <!-- Loads the Ruffle Emulator so modern browsers can run the game without Flash Player -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="flash-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            // Points directly to your exact file name in the repository
            player.load("CoverOrangeLP_v13k.swf"); 

            // Sets the game canvas size (Adjust these numbers if the game looks too small or big)
            player.style.width = "800px";
            player.style.height = "600px";
        });
    </script>

</body>
</html>
