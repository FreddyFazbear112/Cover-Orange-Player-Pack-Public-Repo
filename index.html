<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Orange Player Pack</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #flash-container { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- This is where your Flash file will display -->
    <div id="flash-container"></div>

    <!-- Load the Ruffle Emulator from a free public CDN -->
    <script src="https://unpkg.com"></script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            // This path points directly to your specific file on GitHub Pages
            player.load("https://github.io"/); 
        });
    </script>

</body>
</html>
